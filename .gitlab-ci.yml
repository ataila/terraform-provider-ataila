# CI for terraform-provider-ataila.
#
# This GitLab project is the primary repository and the only build. The public
# mirror never builds: release files are built and signed here once.
#
# Every push:  toolchain probe · lint · leak guard · unit tests ·
#              acceptance (oldest + newest OpenTofu, oldest + newest Terraform,
#              two shards of domains each, from one compiled test binary) ·
#              cross-CLI state and state upgrade (oldest pair, newest pair) ·
#              build
# main:        also the strict leak guard, then the push to the public mirror
# A v* tag:    all of the above, then goreleaser archives + SHA256SUMS +
#              detached signature, the air-gapped mirror bundle, the tag pushed
#              to the public mirror and the signed files published as its
#              GitHub release
#
# Nothing leaves GitLab unless the strict leak guard passed on that commit:
# release, mirror, mirror:github and publish:github all need it. The two
# GitHub jobs exist only while their tokens are set (README, "CI and releases").
#
# Jobs run on shell runners. Go, OpenTofu and Terraform are downloaded into the
# build directory and checked against pinned SHA-256 sums (scripts/ci/toolchain.sh);
# nothing is installed on the runner. When a runner cannot provide something the
# job fails and says what an operator must install or allow.

workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH

stages:
  - check
  - test
  # After the acceptance matrix, not beside it: the in-process provider of the
  # acceptance tests must start within the test framework's fixed two seconds,
  # which a runner busy with provider builds and CLI runs can miss.
  - cross-cli
  - build
  - release
  - publish

variables:
  # One tag per position, as in the platform's shared CI templates.
  RUNNER_TAG: shell
  GO_VERSION: "1.27.1"
  GOTOOLCHAIN: local
  # -modcacherw: Go makes its module cache read-only by default, and the
  # runner's `git clean` between jobs then cannot delete .cache/.
  GOFLAGS: -mod=readonly -modcacherw
  GOPROXY: https://proxy.golang.org,direct
  GOMODCACHE: $CI_PROJECT_DIR/.cache/gomod
  GOCACHE: $CI_PROJECT_DIR/.cache/gobuild
  TOOLCHAIN_DIR: $CI_PROJECT_DIR/.cache/tools
  # No update checks from the CLIs under test.
  CHECKPOINT_DISABLE: "1"
  # The Terraform that renders docs/ in the lint job (tfplugindocs needs one).
  DOCS_TERRAFORM_VERSION: "1.16.4"
  GORELEASER_VERSION: v2.18.2

default:
  tags: [$RUNNER_TAG]
  interruptible: true
  hooks:
    # A build directory left by an older job may hold a read-only module
    # cache; make it deletable before the runner cleans the directory.
    pre_get_sources_script:
      - if [ -d "$CI_PROJECT_DIR/.cache" ]; then chmod -R u+w "$CI_PROJECT_DIR/.cache"; fi

.go:
  # The runners keep the cache locally, one archive per runner. Only lint
  # saves it; every other job restores it and saves nothing. When twenty jobs
  # of one pipeline each wrote the whole cache back at once, the archives
  # filled the runners' disks and saving took longer than the tests.
  cache: &go_cache
    key: go-$GO_VERSION
    paths:
      - .cache/
    policy: pull
  before_script:
    - source scripts/ci/toolchain.sh
    - ensure_go

toolchain:probe:
  stage: check
  cache: []
  script:
    - source scripts/ci/toolchain.sh
    - probe

lint:
  stage: check
  extends: .go
  # The one job that saves the Go cache (toolchain, modules, build cache).
  cache:
    <<: *go_cache
    policy: pull-push
  script:
    - echo "== gofmt"
    - unformatted=$(gofmt -l $(git ls-files '*.go'))
    - if [ -n "$unformatted" ]; then echo "Not gofmt-formatted:" $unformatted; exit 1; fi
    - echo "== go vet"
    - go vet ./...
    - echo "== go.mod and go.sum are tidy"
    - go mod tidy -diff
    - echo "== every acceptance test is in exactly one CI domain, every domain in the matrix"
    - bash scripts/ci/acc-domains.sh --check
    - echo "== generated client and docs are current"
    - ensure_cli terraform "$DOCS_TERRAFORM_VERSION"
    - export PATH="$(dirname "$CLI_PATH"):$PATH"
    - go generate ./...
    - |
      if ! git diff --exit-code -- internal/client docs; then
        echo "Generated files are stale: run 'go generate ./...' and commit the result."
        exit 1
      fi

leak-guard:
  stage: check
  cache: []
  variables:
    # The guard scans the branch's whole history; a shallow clone makes it fail.
    GIT_STRATEGY: clone
    GIT_DEPTH: "0"
  script:
    - bash scripts/leak-guard.sh

# The same guard, refusing every finding in history: none may be listed in
# scripts/leak-guard-history.txt. Runs on the default branch and on every tag,
# before anything is mirrored or released; release, mirror, mirror:github and
# publish:github need it.
leak-guard:strict:
  stage: check
  cache: []
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: "0"
  script:
    - bash scripts/leak-guard.sh --strict

unit:
  stage: test
  extends: .go
  script:
    - go test ./... -count=1 -coverprofile=coverage.out
    - go tool cover -func=coverage.out | tail -n 1

# The acceptance tests compiled once, with the provider binary, so that the
# acceptance jobs need neither Go nor the Go cache: restoring that cache, tens
# of thousands of files, side by side on one runner took up to ten minutes,
# far longer than the tests. Static (no cgo), so that it runs on any runner.
test-binary:
  stage: check
  extends: .go
  script:
    - mkdir -p bin
    - CGO_ENABLED=0 go test -c -o bin/provider.test ./internal/provider/
    - CGO_ENABLED=0 go build -o bin/terraform-provider-ataila .
    - ls -l bin/
  artifacts:
    paths:
      - bin/
    expire_in: 1 day

acceptance:
  stage: test
  cache: []
  needs: [test-binary]
  parallel:
    matrix:
      # Oldest and newest supported release of each CLI. The oldest is the
      # minimum the README declares; raise both together. Each CLI version
      # runs the tests in two shards of domains (scripts/ci/acc-domains.sh),
      # one job each, so that no job runs long; the lint job checks that
      # every acceptance test is in exactly one domain and that each list
      # below names every domain once.
      - ACC_CLI: tofu
        ACC_CLI_VERSION: ["1.6.0", "1.12.6"]
        ACC_DOMAIN: [tenancy+users-gateway, projects-releases+ai-licence-brand]
      - ACC_CLI: terraform
        ACC_CLI_VERSION: ["1.6.0", "1.16.4"]
        ACC_DOMAIN: [tenancy+users-gateway, projects-releases+ai-licence-brand]
  script:
    - source scripts/ci/toolchain.sh
    - ensure_cli "$ACC_CLI" "$ACC_CLI_VERSION"
    - chmod +x bin/provider.test bin/terraform-provider-ataila
    - export ATAILA_PROVIDER_DIR="$CI_PROJECT_DIR/bin"
    - export TF_ACC=1 TF_ACC_TERRAFORM_PATH="$CLI_PATH"
    - if [ "$ACC_CLI" = tofu ]; then export TF_ACC_PROVIDER_HOST=registry.opentofu.org; fi
    - run=$(bash scripts/ci/acc-domains.sh "$ACC_DOMAIN")
    # Run in the package's directory, as go test runs it.
    - (cd internal/provider && "$CI_PROJECT_DIR/bin/provider.test" -test.run "$run" -test.count=1 -test.v -test.timeout 15m) > acceptance.log 2>&1 || { cat acceptance.log; exit 1; }
    - cat acceptance.log
    # A run in which the acceptance tests silently skipped is a failure.
    - |
      passed=$(grep -c '^--- PASS: TestAcc' acceptance.log || true)
      skipped=$(grep -c '^--- SKIP: TestAcc' acceptance.log || true)
      echo "acceptance ($ACC_DOMAIN) under $ACC_CLI $ACC_CLI_VERSION: $passed passed, $skipped skipped"
      if [ "$passed" -eq 0 ] || [ "$skipped" -ne 0 ]; then
        echo "Acceptance tests did not all run."
        exit 1
      fi
  artifacts:
    when: always
    paths:
      - acceptance.log
    expire_in: 1 week

# One state, both CLIs, both orders (TestCrossCLIState), with the provider
# built and installed through dev_overrides as a user installs it: OpenTofu
# reads a Terraform state unaided; Terraform refuses an OpenTofu state until
# `terraform state replace-provider`, then reads it without a diff. Run for
# the oldest and for the newest supported pair.
cross-cli-state:
  stage: cross-cli
  extends: .go
  variables:
    # The state upgrade check builds the previous release from its tag.
    GIT_DEPTH: "0"
  parallel:
    matrix:
      - XCLI_TOFU: "1.6.0"
        XCLI_TERRAFORM: "1.6.0"
      - XCLI_TOFU: "1.12.6"
        XCLI_TERRAFORM: "1.16.4"
  script:
    - ensure_cli terraform "$XCLI_TERRAFORM"
    - export ATAILA_CROSS_CLI_TERRAFORM="$CLI_PATH"
    - ensure_cli tofu "$XCLI_TOFU"
    - export ATAILA_CROSS_CLI_TOFU="$CLI_PATH"
    - export ATAILA_PROVIDER_DIR="$(mktemp -d)"
    - go build -o "$ATAILA_PROVIDER_DIR/terraform-provider-ataila" .
    # The previous release: the newest v* tag that is not this pipeline's own.
    - git fetch --quiet --tags --force origin
    - previous=$(git tag --list 'v*' --sort=-v:refname | grep -vxF "${CI_COMMIT_TAG:-none}" | head -n 1)
    - test -n "$previous" || { echo "No earlier release tag to upgrade from."; exit 1; }
    - echo "upgrading a state of $previous"
    - export ATAILA_PREVIOUS_PROVIDER_DIR="$(mktemp -d)"
    - prevsrc="$(mktemp -d)"
    - git archive "$previous" | tar -x -C "$prevsrc"
    - (cd "$prevsrc" && go build -o "$ATAILA_PREVIOUS_PROVIDER_DIR/terraform-provider-ataila" .)
    - go test ./internal/provider/ -run '^TestCrossCLIState(Upgrade)?$' -count=1 -v -timeout 15m > cross-cli.log 2>&1 || { cat cross-cli.log; exit 1; }
    - cat cross-cli.log
    # A run in which a check, or either order, silently skipped is a failure.
    - |
      for check in TestCrossCLIState TestCrossCLIStateUpgrade; do
        for order in terraform-first opentofu-first; do
          if ! grep -q "^    --- PASS: $check/$order" cross-cli.log; then
            echo "$check did not run the $order order."
            exit 1
          fi
        done
      done
  artifacts:
    when: always
    paths:
      - cross-cli.log
    expire_in: 1 week

build:
  stage: build
  extends: .go
  script:
    - base=$(sed -n 's/^var version = "\(.*\)"$/\1/p' main.go)
    - version="${CI_COMMIT_TAG#v}"; version="${version:-$base-dev+$CI_COMMIT_SHORT_SHA}"
    - |
      for target in linux/amd64 linux/arm64 darwin/arm64 windows/amd64; do
        os=${target%/*}; arch=${target#*/}; ext=""; [ "$os" = windows ] && ext=.exe
        CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=$version" \
          -o "dist/terraform-provider-ataila_${version}_${os}_${arch}${ext}" .
      done
    - ls -l dist/
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

# The signed release (README, "CI and releases"). The key is an RSA key (the
# registries verify RSA and DSA signatures only; RSA-4096 recommended) in the
# protected, masked File variable GPG_PRIVATE_KEY with its fingerprint in
# GPG_FINGERPRINT; v* tags are protected so that both reach the tag pipeline.
# scripts/ci/signing-key.sh stops the job, naming what is missing, before
# anything is built.
release:
  stage: release
  extends: .go
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
  # Every check of the pipeline, the strict leak guard first; spelt out so that
  # the gate stays when someone gives this job needs of its own.
  needs:
    - job: "leak-guard:strict"
      artifacts: false
    - job: leak-guard
      artifacts: false
    - job: lint
      artifacts: false
    - job: unit
      artifacts: false
    - job: test-binary
      artifacts: false
    - job: acceptance
      artifacts: false
    - job: cross-cli-state
      artifacts: false
    - job: build
      artifacts: false
  variables:
    GIT_DEPTH: "0"
  script:
    - export GNUPGHOME="$(mktemp -d)"
    - bash scripts/ci/signing-key.sh
    - base=$(sed -n 's/^var version = "\(.*\)"$/\1/p' main.go)
    - |
      if [ "v$base" != "$CI_COMMIT_TAG" ]; then
        echo "RELEASE STOPPED: tag $CI_COMMIT_TAG does not match version $base in main.go."
        exit 1
      fi
    - GOBIN="$TOOLCHAIN_DIR/bin" go install "github.com/goreleaser/goreleaser/v2@$GORELEASER_VERSION"
    - '"$TOOLCHAIN_DIR/bin/goreleaser" release --clean --skip=publish,announce'
    - rm -rf "$GNUPGHOME"
    # The registries fetch the manifest next to the archives; its checksum is already in SHA256SUMS.
    - cp terraform-registry-manifest.json "dist/terraform-provider-ataila_${base}_manifest.json"
    - (cd dist && sha256sum -c --ignore-missing "terraform-provider-ataila_${base}_SHA256SUMS")
  artifacts:
    paths:
      - dist/*.zip
      - dist/*_SHA256SUMS
      - dist/*_SHA256SUMS.sig
      - dist/*_manifest.json
    expire_in: never

# The air-gapped mirror bundle (README, "Installing without internet
# access"): the build job's binaries under both registry addresses, in the
# filesystem_mirror layout, in one archive. It needs no signing key, so it is
# made on every release tag whether or not the signed release could be.
mirror:
  stage: release
  extends: .go
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
  needs:
    - job: "leak-guard:strict"
      artifacts: false
    - job: build
  script:
    - version="${CI_COMMIT_TAG#v}"
    - go run ./scripts/mirror -version "$version" -dist dist -out "dist/terraform-provider-ataila_${version}_mirror.zip"
    - (cd dist && sha256sum "terraform-provider-ataila_${version}_mirror.zip" | tee "terraform-provider-ataila_${version}_mirror.zip.sha256")
  artifacts:
    paths:
      - dist/*_mirror.zip
      - dist/*_mirror.zip.sha256
    expire_in: never

# The one-way mirror to the public repository (README, "CI and releases"): the
# default branch and v* tags, pushed by this job only after both leak guards
# passed on exactly that commit. Deliberately not a GitLab push mirror, which
# pushes before any pipeline runs. Never forces. Exists only while the
# protected, masked GITHUB_MIRROR_TOKEN is set.
mirror:github:
  stage: publish
  cache: []
  interruptible: false
  rules:
    - if: $GITHUB_MIRROR_TOKEN && $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
    - if: $GITHUB_MIRROR_TOKEN && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs:
    - job: leak-guard
      artifacts: false
    - job: "leak-guard:strict"
      artifacts: false
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: "0"
  script:
    - bash scripts/ci/mirror-github.sh

# The signed files of the release job, published as the GitHub release of the
# tag the mirror pushed, where both registries read them. Builds nothing.
# Exists only while the protected, masked GITHUB_RELEASE_TOKEN is set; until
# then a tag's pipeline ends at release.
publish:github:
  stage: publish
  extends: .go
  interruptible: false
  rules:
    - if: $GITHUB_RELEASE_TOKEN && $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
  needs:
    - job: release
    - job: "leak-guard:strict"
      artifacts: false
    - job: "mirror:github"
      artifacts: false
      optional: true
  script:
    - go run ./scripts/github-release -repo ataila/terraform-provider-ataila -tag "$CI_COMMIT_TAG" -commit "$CI_COMMIT_SHA" -dir dist
